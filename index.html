<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desa Warung Menteng — Smart Village</title>
  <meta name="description" content="Website resmi Desa Warung Menteng, Kecamatan Cijeruk, Kabupaten Bogor. Informasi wisata, UMKM, layanan desa, dan potensi desa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/logo.png" type="image/x-icon"/>
</head>
<body>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Desa Warung Menteng" class="logo-img" />
        Warung Menteng
      </a>
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links"></ul>
      <button class="search-toggle" aria-label="Cari" id="searchToggle">&#x1F50D;</button>
    </nav>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Cari destinasi, kuliner, UMKM..." />
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</header>

<div class="search-overlay" id="searchOverlay"></div>

<section class="hero" id="home">
  <div class="hero-bg">
    <div class="hero-bg-overlay"></div>
  </div>
  <div class="container">
    <div class="hero-content">
      <div class="hero-badge" id="heroBadge"></div>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="hero-buttons">
        <a href="pariwisata.html" class="btn btn-primary">Jelajahi Wisata</a>
        <a href="tentang.html" class="btn btn-dark">Profil Desa</a>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </div>
  </div>
</section>

<section class="section bg-light" id="tentang">
  <div class="container">
    <div class="about-grid">
      <div class="reveal">
        <div class="about-text-box">
          <div class="section-label">Sekilas Desa</div>
          <h2 class="section-title" id="profileTitle"></h2>
          <div class="section-divider left"></div>
          <p class="section-desc" style="margin-bottom:24px;" id="profileDesc1"></p>
          <p style="line-height:1.8;" id="profileDesc2"></p>
          <a href="tentang.html" class="btn btn-outline" style="margin-top:24px;">Selengkapnya &rarr;</a>
        </div>
      </div>
      <div class="reveal">
        <div class="stats-row" id="profileStats"></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container" id="footerContent"></div>
</footer>

<div class="lightbox">
  <div class="lightbox-content"></div>
  <button class="lightbox-close">&times;</button>
</div>

<div class="service-modal" id="serviceModal">
  <div class="service-modal-bg"></div>
  <div class="service-modal-content">
    <button class="service-modal-close">&times;</button>
    <div class="service-modal-icon" id="modalServiceIcon"></div>
    <h3 id="modalServiceName"></h3>
    <p id="modalServiceDesc" style="color:var(--muted);font-size:0.9rem;margin:12px 0 24px;font-weight:300;"></p>
    <div id="modalSuccess" class="service-modal-success">
      <div style="font-size:3rem;margin-bottom:12px;">&#x2705;</div>
      <h3>Pengajuan Terkirim!</h3>
      <p style="color:var(--muted);font-size:0.85rem;margin-top:8px;">Data Anda telah disimpan. Kami akan memproses pengajuan Anda segera.</p>
      <button class="btn btn-primary" id="modalSuccessClose" style="margin-top:20px;">Tutup</button>
    </div>
    <form id="serviceForm">
      <input type="hidden" id="serviceId" />
      <div class="form-group"><label>Nama Lengkap</label><input type="text" id="sName" required /></div>
      <div class="form-group"><label>NIK</label><input type="text" id="sNIK" required /></div>
      <div class="form-group"><label>No. HP</label><input type="tel" id="sPhone" required /></div>
      <div class="form-group"><label>Alamat</label><textarea id="sAddress" required></textarea></div>
      <div class="form-group"><label>Keterangan</label><textarea id="sNotes" placeholder="Opsional"></textarea></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Kirim Pengajuan</button>
    </form>
  </div>
</div>

<div class="status-sidebar-toggle" id="statusToggle">Cek Status</div>
<div class="status-sidebar-panel">
  <div class="status-sidebar-header">
    <h4>Status Pengajuan</h4>
    <button id="statusClose">&times;</button>
  </div>
  <div class="status-sidebar-body" id="statusBody"></div>
</div>

<script src="data/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
